# This is a reusable workflow that allows you to build and push Docker images to GitHub Container Registry.
name: Docker Build and Push

# Define the event that triggers the workflow.
# This workflow is triggered by a workflow call event.
on:
  workflow_call:

# Define the jobs that run in the workflow.
jobs:
  build:
    name: Push GHCR
    runs-on: ubuntu-24.04
    
    # Define the steps that run in the job.
    steps:
      # Step 1: Checkout repository at the current ref.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      # Step 2: Set up Docker Buildx.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Step 3: Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Step 4: Build and push Docker image to GHCR.
      - name: Build and Push
        id: docker-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      # Step-5: Create a file with the Image reference including the digest.
      - name: Save Docker image reference (with digest) to file
        env:
          IMAGE_DIGEST: ${{ steps.docker-build.outputs.digest }}
          DOCKER_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE_WITH_DIGEST="${DOCKER_IMAGE}@${IMAGE_DIGEST}"
          echo $IMAGE_WITH_DIGEST > with-digest.txt

      # Step-6: Upload Docker image reference artifact
      # This will be used in subsequent jobs/workflows to reference the exact image pushed.
      - name: Upload Docker image reference artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Use the repository name only (no owner) because artifact names
          # cannot contain a forward slash.
          name: ${{ github.event.repository.name }}-image
          path: |
            with-digest.txt