# This is a reusable workflow that scans the application's Docker image stored in GitHub Container Registry.
name: "Image Scan"

# Define the event that triggers the workflow.
# This workflow is triggered by a workflow call event.
on:
  workflow_call:
    inputs:
      severity:
        description: "Severities that make the job fail."
        type: string
        default: "CRITICAL,HIGH"

# Define the jobs that run in the workflow.
jobs:
  image-scan:
    name: "Trivy Scan"
    runs-on: ubuntu-24.04

    steps:      
      # Step-1: Checkout the code.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step-2: Download the generated artifact.
      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Must match the artifact name produced by build-push.yml. Artifact
          # names cannot contain a forward slash, so use the repo name only.
          name: ${{ github.event.repository.name }}-image
          path: ${{ github.event.repository.name }}-image

      # Step-3: Read the image digest from the file and export it as an output variable.
      - name: Get Image Digest
        id: get-image
        run: |
          IMAGE=$(cat ${{ github.event.repository.name }}-image/with-digest.txt)
          echo "result=$IMAGE" >> $GITHUB_OUTPUT

      # Step-4: Full report with all severities (never fails, just reports).
      - name: Trivy scan (full report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.70.0"
          image-ref: ${{ steps.get-image.outputs.result }}
          format: 'json'
          output: 'trivy-results.json'
          exit-code: "0"

      # Step 5: Gate - Fixable vulnerabilities of the given severities fail the job.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.70.0"
          image-ref: ${{ steps.get-image.outputs.result }}
          format: table
          output: trivy-results.txt
          severity: ${{ inputs.severity }}
          ignore-unfixed: "true"
          exit-code: "1"
          skip-setup-trivy: "true"

      # Step 6: Keep the full reports as a downloadable artifact.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: |
            trivy-results.json
            trivy-results.txt
          retention-days: 30
          if-no-files-found: ignore