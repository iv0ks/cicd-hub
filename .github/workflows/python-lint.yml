# This is a reusable workflow that runs Python linting and formatting checks (ruff + black). Meant to run on every pull request.
name: "Python Lint"

# Define the event that triggers the workflow.
# This workflow is triggered by a workflow call event, so consumer projects can run it on their pull requests.
on:
  workflow_call:
    inputs:
      python-version-file:
        description: "File that declares the Python version (.python-version or pyproject.toml)."
        type: string
        default: ".python-version"
      source:
        description: "Paths to lint (space-separated)."
        type: string
        default: "."

# Least-privilege: the job only needs to read the repository contents.
permissions:
  contents: read

# Define the jobs that run in the workflow.
jobs:
  python-lint:
    name: "Python Lint"
    runs-on: ubuntu-24.04

    steps:
      # Step-1: Checkout the code.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step-2: Set up Python. The version comes from the consumer repo's
      # version file, so CI matches local/Docker instead of hardcoding it here.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ${{ inputs.python-version-file }}

      # Step-3: Install the linters. Their config (line length, rules, target
      # version) is read from the consumer project's pyproject.toml.
      - name: Install linters
        run: python -m pip install --upgrade pip ruff black

      # Step-4: Run ruff (lint). --output-format=github annotates the PR diff.
      - name: Ruff
        run: ruff check --output-format=github ${{ inputs.source }}

      # Step-5: Run black in check mode (fails if formatting would change files).
      - name: Black
        run: black --check --diff ${{ inputs.source }}
