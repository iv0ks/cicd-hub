# This is a reusable workflow that scans the repository's filesystem for leaked secrets (credentials, tokens, API keys) so they are caught before merge.
# Meant to run on every pull request as a fast gate.
name: "Secrets Scan"

# Define the event that triggers the workflow.
# This workflow is triggered by a workflow call event, so consumer projects can run it on their pull requests.
on:
  workflow_call:
    inputs:
      scan-ref:
        description: "Path (filesystem reference) to scan."
        type: string
        default: "."

# Least-privilege: the job only needs to read the repository contents.
permissions:
  contents: read

# Define the jobs that run in the workflow.
jobs:
  secrets-scan:
    name: "Trivy Scan"
    runs-on: ubuntu-24.04

    steps:
      # Step-1: Checkout the code.
      # fetch-depth: 0 pulls the full history so secret detection can also cover
      # files that may have been committed earlier in the branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Step-2: Scan the filesystem for secrets. Any finding fails the job
      # (exit-code 1); a leaked credential has no "acceptable" severity.
      - name: Trivy scan (secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.70.0"
          scan-type: fs
          scan-ref: ${{ inputs.scan-ref }}
          scanners: secret
          format: table
          output: trivy-secrets.txt
          exit-code: "1"

      # Step-3: Keep the report as a downloadable artifact for later review,
      # even when the gate fails.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-secrets-report
          path: trivy-secrets.txt
          retention-days: 30
          if-no-files-found: ignore
